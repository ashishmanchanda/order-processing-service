version: '3.8'

services:
  order-service:
    build: .
    container_name: order-management-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      # Scheduler every 30s for easy demo observation
      - SCHEDULER_ORDER_PROMOTE_INTERVAL=30000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

