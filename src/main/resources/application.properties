# ─── Server ────────────────────────────────────────────────────────────────────
server.port=8080

# ─── Application ───────────────────────────────────────────────────────────────
spring.application.name=order-service

# Active profile: dev | prod
# Override via: -Dspring.profiles.active=prod  OR  env var SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=dev

# ─── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Order Management Service
info.app.version=1.0.0

# ─── Swagger / OpenAPI ─────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ─── Scheduler ─────────────────────────────────────────────────────────────────
# Default: 300000 ms = 5 minutes. Set lower (e.g. 30000) for local demo.
scheduler.order.promote.interval=300000

# ─── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.orders.orderservice=DEBUG
logging.level.org.springframework.scheduling=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
spring.jpa.defer-datasource-initialization=true

