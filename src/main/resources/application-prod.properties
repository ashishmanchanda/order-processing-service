# ─── PROD PROFILE: PostgreSQL ──────────────────────────────────────────────────
# Set these via environment variables or secrets manager — never hardcode credentials!
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/orderdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}

# ─── Connection Pool (HikariCP) ────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ─── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Use 'validate' in prod — schema managed by Flyway/Liquibase
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ─── H2 Console — DISABLED in prod ────────────────────────────────────────────
spring.h2.console.enabled=false

# ─── Scheduler: keep 5-minute interval in prod ─────────────────────────────────
scheduler.order.promote.interval=300000

# ─── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.orders.orderservice=INFO
spring.jpa.defer-datasource-initialization=true

